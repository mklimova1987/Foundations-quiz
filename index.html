function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let shuffled = shuffle([...questions]);
let cur = 0, score = 0, answered = false, userAnswers = [];

function imgBlock(q) {
  if (!q.img || !IMGS[q.img]) return '';
  return `<div class="q-img-wrap"><img src="${IMGS[q.img]}" alt="${q.imgcap || ''}"><div class="q-img-cap">${q.imgcap || ''}</div></div>`;
}

function render() {
  const el = document.getElementById('quiz');
  if (cur >= shuffled.length) { renderScore(el); return; }
  const q = shuffled[cur];
  const pct = Math.round((cur / shuffled.length) * 100);
  el.innerHTML = `
    <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-counter">Питання ${cur + 1} з ${shuffled.length}</div>
    <span class="section-tag">${q.section}</span>
    <div class="q-text">${q.q}</div>
    ${imgBlock(q)}
    <div id="opts">${q.opts.map((o, i) => `<button class="opt-btn" id="o${i}" onclick="pick(${i})">${o}</button>`).join('')}</div>
    <div id="fb"></div><div id="nxt"></div>`;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = shuffled[cur];
  const ok = idx === q.ans;
  if (ok) score++;
  userAnswers.push({ q: q.q, chosen: idx, correct: q.ans, opts: q.opts, ok });
  document.querySelectorAll('.opt-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add('correct');
    else if (i === idx && !ok) b.classList.add('wrong');
  });
  document.getElementById('fb').innerHTML = `<div class="feedback ${ok ? 'correct' : 'wrong'}">${ok ? '✓ Правильно! ' : '✗ Неправильно. '}${q.exp}</div>`;
  document.getElementById('nxt').innerHTML = `<button class="next-btn" onclick="next()">${cur < shuffled.length - 1 ? 'Наступне →' : 'Результати →'}</button>`;
}

function next() { cur++; render(); }

function buildEmailBody(pct, msg) {
  let body = `Результат тесту: Конструювання фундаментів у суднобудуванні\n`;
  body += `Hull Outfitting Department\n`;
  body += `${'─'.repeat(50)}\n`;
  body += `Результат: ${score}/${shuffled.length} (${pct}%)\n`;
  body += `${msg.replace(/[🏆👍📚🔁]/g,'').trim()}\n`;
  body += `${'─'.repeat(50)}\n\n`;
  body += `Розбір відповідей:\n\n`;
  userAnswers.forEach((a, i) => {
    body += `${i+1}. ${a.q}\n`;
    body += `   ${a.ok ? '✓' : '✗'} Ваша відповідь: ${a.opts[a.chosen]}\n`;
    if (!a.ok) body += `   ✓ Правильна: ${a.opts[a.correct]}\n`;
    body += '\n';
  });
  return body;
}

function sendEmail() {
  const emailEl = document.getElementById('email-input');
  const statusEl = document.getElementById('email-status');
  const btn = document.getElementById('email-btn');
  const email = emailEl.value.trim();
  if (!email || !email.includes('@')) {
    statusEl.style.color = '#c00';
    statusEl.textContent = 'Введіть коректну email-адресу.';
    return;
  }
  const pct = Math.round((score / shuffled.length) * 100);
  const msg = pct >= 90 ? 'Відмінно! Ви чудово засвоїли матеріал.'
    : pct >= 70 ? 'Добре! Ще трохи практики — і будете на відмінно.'
    : pct >= 50 ? 'Непогано, але варто повторити деякі теми.'
    : 'Рекомендуємо ще раз переглянути навчальні матеріали.';
  const body = buildEmailBody(pct, msg);
  const subject = encodeURIComponent(`Тест: Фундаменти у суднобудуванні — ${score}/${shuffled.length} (${pct}%)`);
  const bodyEnc = encodeURIComponent(body);
  window.open(`mailto:${email}?subject=${subject}&body=${bodyEnc}`);
  btn.disabled = true;
  statusEl.style.color = '#2a7fd4';
  statusEl.textContent = '✓ Відкрито поштовий клієнт. Перевірте вікно браузера.';
  setTimeout(() => { btn.disabled = false; }, 3000);
}

function renderScore(el) {
  const pct = Math.round((score / shuffled.length) * 100);
  const msg = pct >= 90 ? '🏆 Відмінно! Ви чудово засвоїли матеріал.'
    : pct >= 70 ? '👍 Добре! Ще трохи практики — і будете на відмінно.'
    : pct >= 50 ? '📚 Непогано, але варто повторити деякі теми.'
    : '🔁 Рекомендуємо ще раз переглянути навчальні матеріали.';
  const rev = userAnswers.map((a, i) => `
    <div class="ri ${a.ok ? 'ok' : 'fail'}">
      <strong>${i+1}. ${a.q}</strong>
      <span class="ans">Ваша відповідь: <b>${a.opts[a.chosen]}</b>${!a.ok ? `<br>Правильна: <b>${a.opts[a.correct]}</b>` : ''}</span>
    </div>`).join('');
  el.innerHTML = `
    <div class="score-card">
      <div class="score-big">${score}/${shuffled.length}</div>
      <div class="score-sub">правильних відповідей (${pct}%)</div>
      <div class="score-msg">${msg}</div>
      <div id="retake-section" style="margin-top:8px;">
        <button onclick="doRetake()" style="background:#2a7fd4;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-size:14px;cursor:pointer;">
          Пройти ще раз
        </button>
      </div>
    </div>
    <div class="email-section">
      <label>📧 Надіслати результат на email:</label>
      <div class="email-row">
        <input class="email-input" id="email-input" type="email" placeholder="ваш@email.com" />
        <button class="email-btn" id="email-btn" onclick="sendEmail()">Надіслати</button>
      </div>
      <div class="email-status" id="email-status"></div>
    </div>
    <div class="review-title">Розбір відповідей</div>
    ${rev}`;
}

function restart() {
  shuffled = shuffle([...questions]);
  cur = 0; score = 0; answered = false; userAnswers = [];
  render();
}

const STORAGE_KEY = 'quiz_foundations_done';

function checkAlreadyDone() {
  try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : false; }
  catch(e) { return false; }
}

function markDone(name, sc, pct) {
  try {
    const existing = checkAlreadyDone();
    const history = (existing && existing.history) ? existing.history : [];
    history.push({ name, score: sc, pct, date: new Date().toLocaleString('uk-UA') });
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ name, score: sc, pct, date: history[history.length-1].date, history }));
  } catch(e) {}
}

function showLocked(saved) {
  const history = (saved.history) ? saved.history : [{name: saved.name, score: saved.score, pct: saved.pct, date: saved.date}];
  const total = history.length;
  const rows = history.map((h, i) => `
    <tr style="border-bottom:1px solid #e0e8f0;">
      <td style="padding:6px 12px;color:#888;">${i+1}</td>
      <td style="padding:6px 12px;">${h.name}</td>
      <td style="padding:6px 12px;font-weight:600;color:#2a7fd4;">${h.score}/${questions.length} (${h.pct}%)</td>
      <td style="padding:6px 12px;color:#888;font-size:12px;">${h.date}</td>
    </tr>`).join('');
  document.getElementById('quiz').innerHTML = `
    <div style="text-align:center;padding:32px 20px;">
      <div style="font-size:48px;margin-bottom:8px;">🔒</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:4px;color:#222;">Тест вже пройдено</div>
      <div style="font-size:13px;color:#888;margin-bottom:20px;">Кількість спроб: <b>${total}</b></div>
      <div style="overflow-x:auto;margin-bottom:20px;">
        <table style="width:100%;border-collapse:collapse;background:#f8faff;border:1px solid #dde8f8;border-radius:10px;overflow:hidden;font-size:13px;">
          <thead>
            <tr style="background:#e3eefb;color:#446;">
              <th style="padding:8px 12px;text-align:left;">#</th>
              <th style="padding:8px 12px;text-align:left;">Ім'я</th>
              <th style="padding:8px 12px;text-align:left;">Результат</th>
              <th style="padding:8px 12px;text-align:left;">Дата та час</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="margin-top:8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button onclick="doReset()" style="background:#2a7fd4;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-size:14px;cursor:pointer;">
          Пройти ще раз
        </button>
        <button onclick="showClearForm()" style="background:none;border:1px solid #ddd;border-radius:8px;padding:10px 20px;font-size:13px;color:#999;cursor:pointer;">
          🗑 Очистити історію
        </button>
      </div>
      <div id="clear-form" style="display:none;margin-top:12px;">
        <div style="display:flex;gap:8px;max-width:320px;margin:0 auto;">
          <input id="clear-pass" type="password" placeholder="Пароль викладача"
            style="flex:1;padding:8px 12px;border:1px solid #c0c8e0;border-radius:8px;font-size:13px;outline:none;"
            onkeydown="if(event.key===\'Enter\') clearHistory()" />
          <button onclick="clearHistory()"
            style="background:#c0392b;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;">
            OK
          </button>
        </div>
        <div id="clear-err" style="color:#c00;font-size:12px;margin-top:6px;min-height:14px;"></div>
      </div>
    </div>`;
}

function showResetForm() {
  const f = document.getElementById('reset-form');
  if (f) { f.style.display = f.style.display === 'none' ? 'block' : 'none'; }
  setTimeout(() => document.getElementById('reset-pass')?.focus(), 50);
}

function showClearForm() {
  const f = document.getElementById('clear-form');
  if (f) { f.style.display = f.style.display === 'none' ? 'block' : 'none'; }
  setTimeout(() => document.getElementById('clear-pass')?.focus(), 50);
}

function clearHistory() {
  const pass = document.getElementById('clear-pass')?.value;
  const TEACHER_PASS = 'hull2024';
  if (pass === TEACHER_PASS) {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
    location.reload();
  } else {
    const err = document.getElementById('clear-err');
    if (err) err.textContent = 'Невірний пароль.';
    document.getElementById('clear-pass').value = '';
  }
}

function doReset() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  location.reload();
}

function showNameForm() {
  document.getElementById('quiz').innerHTML = `
    <div style="text-align:center;padding:32px 20px;">
      <div style="font-size:15px;font-weight:600;margin-bottom:6px;color:#222;">Введіть своє ім\'я перед початком тесту</div>
      <div style="font-size:13px;color:#888;margin-bottom:18px;">Всі ваші спроби будуть збережені на цьому пристрої.</div>
      <div style="display:flex;gap:10px;max-width:420px;margin:0 auto;">
        <input id="name-input" type="text" placeholder="Прізвище Ім\'я"
          style="flex:1;padding:10px 14px;border:1px solid #c0c8e0;border-radius:8px;font-size:14px;outline:none;"
          onkeydown="if(event.key===\'Enter\') startWithName()" />
        <button onclick="startWithName()"
          style="background:#2a7fd4;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer;">
          Почати →
        </button>
      </div>
      <div id="name-err" style="color:#c00;font-size:13px;margin-top:8px;min-height:16px;"></div>
    </div>`;
  setTimeout(() => document.getElementById('name-input')?.focus(), 50);
}

let studentName = '';

function startWithName() {
  const val = document.getElementById('name-input')?.value.trim();
  if (!val || val.length < 2) {
    document.getElementById('name-err').textContent = 'Будь ласка, введіть ваше імʼя (мінімум 2 символи).';
    return;
  }
  studentName = val;
  render();
}

function showRetakeForm() {
  const f = document.getElementById('retake-form');
  if (f) { f.style.display = f.style.display === 'none' ? 'block' : 'none'; }
  setTimeout(() => document.getElementById('retake-pass')?.focus(), 50);
}

function doRetake() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  shuffled = shuffle([...questions]);
  cur = 0; score = 0; answered = false; userAnswers = [];
  showNameForm();
}

const _origRenderScore = renderScore;
renderScore = function(el) {
  _origRenderScore(el);
  const pct = Math.round((score / shuffled.length) * 100);
  markDone(studentName, score, pct);
  const sub = el.querySelector('.score-sub');
  if (sub) {
    const d = document.createElement('div');
    d.style.cssText = 'font-size:14px;color:#555;margin-bottom:8px;';
    d.textContent = 'Студент: ' + studentName;
    sub.parentNode.insertBefore(d, sub);
  }
  // retake section already has password protection — no need to hide
};

const _saved = checkAlreadyDone();
if (_saved) { showLocked(_saved); } else { showNameForm(); }
</script>
